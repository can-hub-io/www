{% extends "base.html" %}
{% block content %}
<div class="doc-layout wrap">
  {% include "partials/doc-sidebar.html" %}
  <main class="doc-main">
    <div class="breadcrumb"><a href="{{ get_url(path='/') }}">Home</a> / <a href="{{ get_url(path='/docs/') }}">Docs</a> / {{ page.title }}</div>

      {{ page.content | safe }}
    </article>
  </main>
</div>
{% endblock %}
