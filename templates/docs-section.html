{% extends "base.html" %}
{% block content %}
<div class="doc-layout wrap">
  {% include "partials/doc-sidebar.html" %}
  <main class="doc-main">
    <div class="breadcrumb"><a href="{{ get_url(path='/') }}">Home</a> / Docs</div>
    <article class="prose">
      <h1>{{ section.title }}</h1>
      {{ section.content | safe }}
    </article>
    <div class="doc-cards">
      {% for p in section.pages %}
      <a href="{{ p.permalink }}"><strong>{{ p.title }}</strong>{% if p.description %}<span>{{ p.description }}</span>{% endif %}</a>
      {% endfor %}
    </div>
  </main>
</div>
{% endblock %}
