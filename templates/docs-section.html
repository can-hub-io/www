{% extends "base.html" %}
{% block title %}Documentation — {{ config.title }}{% endblock %}
{% block content %}
<main>
<p><a href="/">← can-hub</a></p>
<h1>{{ section.title }}</h1>
{{ section.content | safe }}
<ul>
  {% for page in section.pages %}
  <li><a href="{{ page.permalink }}">{{ page.title }}</a></li>
  {% endfor %}
</ul>
</main>
{% endblock %}
